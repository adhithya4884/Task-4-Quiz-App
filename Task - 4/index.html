<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Quiz Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">

    <div id="quiz-container" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg mx-4">
        <div class="mb-6">
            <p id="question-counter" class="text-sm text-gray-500"></p>
            <h2 id="question-text" class="text-2xl font-bold text-gray-800 mt-2"></h2>
        </div>

        <div id="answer-buttons" class="grid grid-cols-1 gap-4 mb-6"></div>

        <p id="error-message" class="text-red-500 text-sm mb-4 h-5 text-center"></p>

        <button id="next-btn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transform transition-transform duration-200 hover:scale-105">
            Next
        </button>
    </div>

    <div id="results-container" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg mx-4 text-center hidden">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">Quiz Completed!</h2>
        <p id="score-text" class="text-xl text-gray-600 mb-6"></p>
        
        <div id="key-sheet" class="mt-8 text-left border-t pt-6"></div>
        
        <button id="restart-btn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transform transition-transform duration-200 hover:scale-105 mt-8">
            Restart Quiz
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
